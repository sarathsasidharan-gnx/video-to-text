:root{
  /* brand */
  --bnp-green:#00965A;
  --green-deep:#007265;
  --green-light:#5CC6A0;
  --green-tint:#E5F4EC;
  --green-wash:#F2F9F5;
  --green-text:#00663F;
  /* ink and neutrals (warm, from brand black #2D2926) */
  --ink:#2D2926;
  --ink-2:#5E5955;
  --ink-3:#77726E;
  --line:#E2DFDB;
  --line-strong:#CBC7C2;
  --wash:#F5F4F1;
  --track:#ECEAE6;
  --state-none:#DAD6D1;
  /* status (always paired with an icon and a label) */
  --amber:#E89B0C; --amber-tint:#FFF3DA; --amber-text:#8A5A00;
  --red:#D03B3B; --red-tint:#FCE8E6; --red-text:#9E2424;
  --grey-tint:#EFEDEA;
  /* type */
  --font-body:"Deck Sans","Open Sans",Arial,"Segoe UI",sans-serif;
  --font-head:"BNPP Sans Condensed","Deck Sans","Open Sans",Arial,sans-serif;
  /* app chrome around the slides (slides stay white in every theme) */
  --backdrop:#E9E6E2;
  --chrome:#FFFFFF;
  --chrome-ink:#2D2926;
  --chrome-ink-2:#5E5955;
  --chrome-line:#D9D5D0;
  --chrome-hover:#F2F0ED;
  --focus:#007265;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --backdrop:#1D1B1A; --chrome:#292624; --chrome-ink:#F3F1EE; --chrome-ink-2:#C9C4BF;
    --chrome-line:#3B3835; --chrome-hover:#34312E; --focus:#5CC6A0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --backdrop:#1D1B1A; --chrome:#292624; --chrome-ink:#F3F1EE; --chrome-ink-2:#C9C4BF;
  --chrome-line:#3B3835; --chrome-hover:#34312E; --focus:#5CC6A0;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--backdrop);color:var(--chrome-ink);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{overflow:visible}

/* ---------- toolbar ---------- */
.toolbar{position:fixed;inset:0 0 auto 0;min-height:56px;z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--chrome);border-bottom:1px solid var(--chrome-line)}
.tb-title{display:flex;flex-direction:column;line-height:1.2;margin-right:8px;min-width:0}
.tb-title strong{font-size:14px;font-weight:700;white-space:nowrap}
.tb-title span{font-size:12px;color:var(--chrome-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.tb-group{display:flex;align-items:center;gap:6px}
.tb-spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--chrome-line);border-radius:4px;background:var(--chrome);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--chrome-hover)}
.btn svg{width:16px;height:16px;flex:none}
.btn--primary{background:var(--bnp-green);border-color:var(--bnp-green);color:#fff}
.btn--primary:hover{background:#00804D}
.btn--icon{width:34px;padding:0;justify-content:center}
.btn[aria-pressed="true"]{background:var(--chrome-hover);border-color:var(--focus)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.badge--ok{background:var(--bnp-green)}
.tb-date{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--chrome-ink-2)}
.tb-date input{height:34px;border:1px solid var(--chrome-line);border-radius:4px;padding:0 8px;background:var(--chrome);color:var(--chrome-ink)}
.tb-nav{display:flex;align-items:center;gap:4px}
.tb-nav .count{min-width:64px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:40px;min-width:270px;background:var(--chrome);border:1px solid var(--chrome-line);border-radius:6px;padding:6px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:40}
.menu.open .menu-list{display:block}
.menu-list button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;padding:8px 10px;border-radius:4px;cursor:pointer;text-align:left}
.menu-list button:hover{background:var(--chrome-hover)}
.menu-list button b{font-size:13px}
.menu-list button span{font-size:12px;color:var(--chrome-ink-2)}

/* ---------- stage ---------- */
#stage{position:fixed;left:0;right:0;bottom:0;top:var(--tb-h,56px);overflow:hidden}
.view-slides #stage{display:block}
.view-slides .slide-wrap{position:absolute;visibility:hidden;left:50%;top:50%}
.view-slides .slide-wrap.active{visibility:visible}
.view-scroll #stage{overflow:auto;padding:24px 0 64px}
.view-scroll .slide-wrap{position:relative;margin:0 auto 24px}
.slide-wrap{width:calc(1600px * var(--s,1));height:calc(900px * var(--s,1))}
.slide-wrap.is-hidden-slide{display:none}
.slide{position:absolute;left:0;top:0;width:1600px;height:900px;transform:scale(var(--s,1));transform-origin:0 0;background:#fff;color:var(--ink);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 24px rgba(0,0,0,.10);font-size:15px;line-height:1.45}
.presenting{background:#111}
.presenting .toolbar,.presenting .drawer,.presenting .toast{display:none}
.presenting #stage{top:0}
.presenting .slide{box-shadow:none}
.overflowing{outline:2px dashed var(--red);outline-offset:2px}
.presenting .overflowing{outline:none}

/* drop overlay */
.drop{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,114,101,.86);color:#fff;font-size:22px;font-weight:700;text-align:center;padding:24px}
.drop.show{display:flex}
.drop small{display:block;font-size:15px;font-weight:400;margin-top:8px}

/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;max-width:min(720px,calc(100vw - 32px));background:#2D2926;color:#fff;border-radius:6px;padding:12px 14px;display:none;gap:12px;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px}
.toast.show{display:flex}
.toast .t-body{flex:1;white-space:pre-line}
.toast button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:4px 10px;cursor:pointer;font-weight:600}

/* tooltip */
#tooltip{position:fixed;z-index:80;pointer-events:none;display:none;max-width:320px;background:#fff;color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:8px 10px;font-size:12.5px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.14)}
#tooltip .tt-head{font-weight:700;font-size:13px;margin-bottom:2px}
#tooltip .tt-line{color:var(--ink-2)}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:var(--tb-h,56px);right:0;bottom:0;width:min(470px,100vw);z-index:35;background:var(--chrome);color:var(--chrome-ink);border-left:1px solid var(--chrome-line);transform:translateX(102%);transition:transform .18s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--chrome-line)}
.dr-tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--chrome-ink-2);border-bottom:2px solid transparent}
.dr-tabs button[aria-selected="true"]{color:var(--chrome-ink);border-bottom-color:var(--bnp-green)}
.dr-close{margin-left:auto}
.dr-body{flex:1;overflow:auto;padding:16px 18px 40px}
.dr-pane{display:none}
.dr-pane.active{display:block}
.fld{margin:0 0 14px}
.fld>label,.fld>.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.fld .hint{font-size:12px;color:var(--chrome-ink-2);margin-top:4px}
.drawer input[type=text],.drawer input[type=date],.drawer select,.drawer textarea{border:1px solid var(--chrome-line);border-radius:4px;padding:7px 9px;background:var(--chrome);color:var(--chrome-ink)}
.fld input[type=text],.fld input[type=date],.fld select,.fld textarea{width:100%}
.dim-row input[type=text],.dim-row textarea{width:100%}
.dim-row textarea{resize:vertical;min-height:58px;line-height:1.4}
.fld textarea{resize:vertical;min-height:64px;line-height:1.4}
.seg{display:inline-flex;border:1px solid var(--chrome-line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--chrome-line)}
.seg button[aria-pressed="true"]{background:var(--chrome-hover);box-shadow:inset 0 -2px 0 var(--bnp-green)}
.dim-row{border-top:1px solid var(--chrome-line);padding:12px 0}
.dim-row .row2{display:flex;gap:8px;align-items:center;margin:6px 0}
.dim-row .row2 input{flex:1}
.dim-row select{width:auto!important}
.suggest{font-size:12px;color:var(--chrome-ink-2);background:var(--chrome-hover);border-radius:4px;padding:6px 8px;margin-top:6px}
.suggest b{color:var(--chrome-ink)}
.dr-section{font-size:15px;font-weight:700;margin:22px 0 10px}
.dr-section:first-child{margin-top:0}
.check-item{border-top:1px solid var(--chrome-line);padding:10px 0}
.check-item summary{cursor:pointer;display:flex;gap:8px;align-items:flex-start;list-style:none}
.check-item summary::-webkit-details-marker{display:none}
.check-item ul{margin:6px 0 0 26px;padding:0;font-size:12.5px;color:var(--chrome-ink-2)}
.check-item .cnt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.help h3{font-size:14px;margin:18px 0 6px}
.help ol,.help ul{padding-left:20px;margin:6px 0}
.help li{margin:4px 0}
.help code{background:var(--chrome-hover);padding:1px 4px;border-radius:3px;font-size:12px}
.help table{border-collapse:collapse;width:100%;font-size:12px}
.help td,.help th{border-top:1px solid var(--chrome-line);padding:5px 4px;text-align:left;vertical-align:top}
.slide-toggles label{display:flex;gap:8px;align-items:center;padding:4px 0;font-weight:400}

/* ==========================================================================
   SLIDE SYSTEM (1600 x 900 canvas)
   ========================================================================== */
.s-topbar{position:absolute;left:0;right:0;top:0;height:6px;background:var(--bnp-green)}
.s-header{position:absolute;top:6px;left:56px;right:56px;height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.s-brand{display:flex;align-items:center;gap:16px;min-width:0}
.s-logo{display:flex;align-items:center;height:30px}
.s-logo img{max-height:30px;max-width:220px;display:block}
.s-logo-text{font-weight:700;font-size:15px;color:var(--bnp-green)}
.s-divider{width:1px;height:22px;background:var(--line-strong)}
.s-context{font-size:14px;color:var(--ink-2);white-space:nowrap;display:flex;gap:10px;align-items:baseline}
.s-context b{color:var(--ink);font-weight:700}
.s-meta{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.s-titleblock{position:absolute;top:84px;left:56px;right:56px}
.s-title{margin:0;font-family:var(--font-head);font-stretch:condensed;font-weight:700;font-size:40px;line-height:1.08;letter-spacing:-.005em;color:var(--ink)}
.s-takeaway{margin:8px 0 0;font-size:19px;line-height:1.4;color:var(--ink-2);max-width:1380px;max-height:54px;overflow:hidden}
.s-body{position:absolute;top:200px;left:56px;right:56px;bottom:58px}
.s-footer{position:absolute;left:56px;right:56px;bottom:0;height:42px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.s-footer .pg{font-variant-numeric:tabular-nums}
.s-footer .f-l{display:flex;gap:12px}
.s-footer .f-l b{font-weight:700;color:var(--ink-2)}
.h-sec{margin:0 0 10px;font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.h-sec .n{font-weight:600;color:var(--ink-3);font-size:14px}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.empty{color:var(--ink-3);font-size:15px;padding:12px 0}

/* RAG pills, chips, icons */
.rag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:13px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1}
.rag svg{width:12px;height:12px;flex:none}
.rag--green{background:var(--green-tint);color:var(--green-text)}
.rag--amber{background:var(--amber-tint);color:var(--amber-text)}
.rag--red{background:var(--red-tint);color:var(--red-text)}
.rag--none{background:var(--grey-tint);color:var(--ink-2)}
.rag--lg{height:40px;padding:0 16px 0 12px;border-radius:20px;font-size:19px;gap:8px}
.rag--lg svg{width:16px;height:16px}
.trend{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.trend svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip svg{width:13px;height:13px;flex:none}
.chip--done{color:var(--green-text)}
.chip--late{color:var(--red-text)}
.chip--warn{color:var(--amber-text)}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
.prio svg{width:13px;height:13px}
.prio--critical{color:var(--red-text)}
.prio--high{color:var(--amber-text)}
.prio--medium,.prio--low{color:var(--ink-2);font-weight:600}
.ms{display:inline-block;width:9px;height:9px;background:var(--ink);transform:rotate(45deg);margin:0 7px 1px 1px;flex:none}
.pbar{position:relative;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--bnp-green);border-radius:3px}

/* ---------- cover ---------- */
.cv-head{position:absolute;top:6px;left:56px;right:56px;height:72px;display:flex;align-items:center;justify-content:space-between}
.cv-class{font-size:13px;color:var(--ink-3)}
.cv-main{position:absolute;top:118px;left:56px;right:56px;display:flex;justify-content:space-between;gap:48px}
.cv-kicker{font-size:20px;font-weight:600;color:var(--green-deep);margin:0 0 10px}
.cv-title{margin:0;font-family:var(--font-head);font-stretch:condensed;font-weight:700;font-size:80px;line-height:1.0;letter-spacing:-.01em;color:var(--ink);max-width:1050px}
.cv-period{margin-top:16px;font-size:20px;color:var(--ink-2)}
.cv-by{margin-top:6px;font-size:15px;color:var(--ink-3)}
.cv-status{min-width:300px;padding-top:6px;text-align:right}
.cv-status .lbl{font-size:14px;color:var(--ink-3);margin-bottom:8px}
.cv-status .trend{justify-content:flex-end;margin-top:10px;font-size:15px}
.cv-facts{position:absolute;left:56px;right:56px;top:372px;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px;border-top:1px solid var(--line);padding-top:20px}
.cv-facts .k{font-size:13px;color:var(--ink-3);margin-bottom:6px}
.cv-facts .v{font-size:16.5px;line-height:1.42;color:var(--ink)}
.cv-facts .v small{display:block;font-size:14px;color:var(--ink-2);margin-top:4px}
.cv-band{position:absolute;left:0;right:0;bottom:0;height:300px;background:var(--green-deep);color:#fff}
.cv-band svg{position:absolute;left:0;top:0}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:14px 20px 14px 0;min-height:126px}
.kpi+.kpi{padding-left:22px;border-left:1px solid var(--line)}
.kpi .lbl{font-size:14px;color:var(--ink-2);font-weight:600}
.kpi .val{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.kpi .val b{font-size:46px;line-height:1.05;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.kpi .val .unit{font-size:16px;color:var(--ink-2);font-weight:600}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 8px;border-radius:11px}
.kpi .delta svg{width:11px;height:11px}
.delta--bad{background:var(--red-tint);color:var(--red-text)}
.delta--warn{background:var(--amber-tint);color:var(--amber-text)}
.delta--good{background:var(--green-tint);color:var(--green-text)}
.delta--neutral{background:var(--grey-tint);color:var(--ink-2)}
.kpi .foot{margin-top:6px;font-size:13.5px;color:var(--ink-2);line-height:1.35}

/* ---------- executive summary ---------- */
.ex-grid{display:grid;grid-template-columns:720px 1fr;gap:48px;margin-top:22px}
.dims{width:100%;border-collapse:collapse}
.dims td{border-top:1px solid var(--line);padding:9px 10px 9px 0;vertical-align:top}
.dims tr:first-child td{border-top:0}
.dims .dn{width:170px;font-weight:700;font-size:15px;padding-top:12px}
.dims .dr{width:112px;padding-top:9px}
.dims .dt{width:96px;padding-top:13px}
.dims .dx{font-size:14px;line-height:1.38;color:var(--ink-2)}
.msgs{display:grid;grid-template-rows:auto auto auto;gap:12px}
.msg h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:7px}
.msg h4 svg{width:15px;height:15px}
.msg ul{margin:0;padding:0;list-style:none}
.msg li{position:relative;padding-left:16px;font-size:14.2px;line-height:1.38;margin:3px 0;color:var(--ink)}
.msg li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:1px;background:var(--ink-3)}
.decide{position:absolute;left:0;right:0;bottom:0;background:var(--green-wash);border-left:4px solid var(--bnp-green);padding:12px 20px 12px 18px;min-height:96px}
.decide h4{margin:0 0 6px;font-size:15px}
.decide ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 36px}
.decide li{font-size:14.2px;line-height:1.38;display:flex;gap:10px}
.decide li .ix{flex:none;width:22px;height:22px;border-radius:11px;background:var(--bnp-green);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.decide li .who{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}

/* ---------- this week ---------- */
.wk-strip{display:flex;gap:28px;align-items:baseline;font-size:14px;color:var(--ink-2);margin:-4px 0 14px}
.wk-strip b{color:var(--ink)}
.wk-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;height:520px}
.wk-col{min-width:0;display:flex;flex-direction:column}
.wk-col h3{margin:0;padding:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink)}
.wk-col h3 svg{width:15px;height:15px}
.wk-col h3>span:not(.n){white-space:nowrap}
.wk-col h3 .n{margin-left:auto;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.wk-col.c-late h3{border-bottom-color:var(--red)}
.wk-col.c-done h3{border-bottom-color:var(--bnp-green)}
.wk-col.c-prog h3{border-bottom-color:var(--green-light)}
.wk-col.c-next h3{border-bottom-color:var(--ink-3)}
.wk-list{list-style:none;margin:0;padding:0;overflow:hidden}
.wk-item{padding:10px 0 9px;border-bottom:1px solid var(--line)}
.wk-item .t{font-size:14.5px;font-weight:600;line-height:1.3;display:flex;align-items:flex-start}
.wk-item .t .ms{margin-top:6px}
.wk-item .m{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wk-item .pbar{margin-top:6px;width:100%}
.wk-item .c{margin-top:6px;font-size:12.5px;line-height:1.35;color:var(--ink-2);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wk-more{font-size:13px;color:var(--ink-2);padding:8px 0}
.wk-ahead{position:absolute;left:0;right:0;bottom:0;display:flex;gap:28px;font-size:14px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
.wk-ahead b{color:var(--ink)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
.tbl td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl .r{text-align:right}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .grp td{background:var(--wash);font-weight:700;font-size:13px;color:var(--ink);padding:6px 10px}
.tbl .t2{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.tbl .nowrap{white-space:nowrap}

/* ---------- figure chrome ---------- */
.fig{position:relative}
.fig-head{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.fig-head h3{margin:0;font-size:16px}
.fig-legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.fig-legend span{display:inline-flex;align-items:center;gap:6px}
.fig-legend i{display:inline-block;width:12px;height:12px;border-radius:2px}
.fig-legend i.line{height:2px;width:16px;border-radius:1px}
.fig-tbtn{margin-left:auto;font-size:12px;border:1px solid var(--line-strong);background:#fff;border-radius:3px;padding:2px 8px;cursor:pointer;color:var(--ink-2)}
.fig .fig-table{display:none}
.fig.show-table .fig-chart{display:none}
.fig.show-table .fig-table{display:block;max-height:520px;overflow:auto}
.axis text{font-size:12px;fill:var(--ink-3)}
.grid line{stroke:var(--line);stroke-width:1}
[data-tip]{cursor:default}

/* ---------- progress slide ---------- */
.pg-grid{display:grid;grid-template-columns:860px 1fr;gap:56px}
.bul-row{display:grid;grid-template-columns:130px 1fr 110px;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bul-row .nm{font-weight:700;font-size:14.5px}
.bul-row .nm small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.bul-row .vals{text-align:right;font-size:13px;color:var(--ink-2);line-height:1.3}
.bul-row .vals b{color:var(--ink);font-size:15px}
.bul-row.total .nm{font-size:15px}
.bul{position:relative;height:18px;background:var(--track);border-radius:3px}
.bul i{position:absolute;left:0;top:0;bottom:0;background:var(--bnp-green);border-radius:3px}
.bul em{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:1px}
.pace{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}
.pace .p b{display:block;font-size:34px;font-weight:700;line-height:1.1}
.pace .p span{font-size:13.5px;color:var(--ink-2)}
.mix{margin-top:22px}
.mix-bar{display:flex;height:22px;gap:2px;margin:8px 0 6px}
.mix-bar i{display:block;height:100%}
.mix-bar i:first-child{border-radius:3px 0 0 3px}
.mix-bar i:last-child{border-radius:0 3px 3px 0}

/* ---------- scope slide ---------- */
.sc-grid{display:grid;grid-template-columns:500px 1fr;gap:52px}
.path{}
.path-opt{padding:12px 0 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:28px 1fr;gap:6px 12px}
.path-opt .tag{grid-column:1;grid-row:1 / span 3;width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;background:var(--bnp-green)}
.path-opt.alt .tag{background:#fff;color:var(--ink);border:2px solid var(--ink-3)}
.path-opt h4{margin:0;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.path-opt p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.4}
.path-opt .when{font-size:13px;color:var(--ink);font-weight:600}
.decision-box{margin-top:14px;background:var(--green-wash);border-left:4px solid var(--bnp-green);padding:12px 16px}
.decision-box b{display:block;font-size:15px}
.decision-box span{font-size:14px;color:var(--ink-2)}
.uat{margin-top:14px;font-size:14px;color:var(--ink-2);line-height:1.45}
.uat b{color:var(--ink)}

.mx-legend span{display:inline-flex;align-items:center;gap:6px}
.mx-legend svg{width:16px;height:16px}

/* ---------- RAID slide ---------- */
.rd-sum{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.rd-sum .c{padding:10px 26px 10px 0;margin-right:26px;border-right:1px solid var(--line)}
.rd-sum .c:last-child{border-right:0}
.rd-sum b{font-size:30px;line-height:1.1;display:block}
.rd-sum span{font-size:13px;color:var(--ink-2)}
.raid .ttl{font-weight:600;font-size:13.8px}
.raid td{padding-top:8px;padding-bottom:8px}
.esc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--red-text);background:var(--red-tint);border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.esc svg{width:10px;height:10px}

/* ---------- profile slide ---------- */
.pf-grid{display:grid;grid-template-columns:520px 380px 1fr;gap:48px}
.pf-goal{font-size:17px;line-height:1.45;color:var(--ink);margin:0 0 14px}
.pf-list{margin:0;padding:0;list-style:none}
.pf-list li{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.38}

.kd{list-style:none;margin:0;padding:0;position:relative}
.kd li{display:grid;grid-template-columns:22px 112px 1fr;gap:8px;align-items:start;padding:6px 0;font-size:13.5px;line-height:1.3}
.kd .dot{width:12px;height:12px;border-radius:6px;border:2px solid var(--bnp-green);background:#fff;margin:3px 0 0 4px}
.kd .past .dot{background:var(--bnp-green)}
.kd .golive .dot{border-color:var(--ink);background:var(--ink);border-radius:2px;transform:rotate(45deg)}
.kd .dt{font-weight:600;font-variant-numeric:tabular-nums}
.kd .lb small{display:block;color:var(--ink-3);font-size:12px}
.tm{list-style:none;margin:0;padding:0;columns:1}
.tm-grp{margin:0 0 10px}
.tm-grp h4{margin:0 0 4px;font-size:13px;color:var(--ink-3);font-weight:600}
.tm-grp div{font-size:13.5px;line-height:1.35;padding:2px 0}
.tm-grp div b{font-weight:700}
.tm-grp div span{color:var(--ink-2)}
.gov{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px;line-height:1.45}
.gov div{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:2px 0}
.gov span{color:var(--ink-3)}

.defs td:first-child{font-weight:700;width:210px}
.defs td:nth-child(3){width:330px;font-size:12.8px}
.defs td:nth-child(4){width:200px;font-size:12.8px;color:var(--ink-2)}

function findHeader(rows, aliases, minHits) {

}

      id: str(cell(r, m, 'id')) || String(out.length + 1),
      row: hdr.row + 2 + i,

function importSheets(sheets, fileName) {
  const found = { notes: [] };
  for (const sh of sheets) {
    const nm = sh.name.toLowerCase();
    if (/read ?me|instructions|guide/.test(nm)) continue;
    const th = findHeader(sh.rows, TASK_ALIASES, 4);
    if (th && th.map.title != null && (th.map.due != null || th.map.status != null) && th.hits >= 5 && !/raid/.test(nm)) {
      const tasks = mapTasks(sh, th);
      if (tasks.length) {
        found.tasks = (found.tasks || []).concat(tasks);
        const missing = ['phase', 'status', 'start', 'due', 'progress'].filter(k => th.map[k] == null);
        found.notes.push(`${fileName} › ${sh.name}: ${plural(tasks.length, 'task')}` + (missing.length ? ` (columns not found: ${missing.join(', ')})` : ''));
        continue;
      }
    }
    if (isKv(sh.rows)) {
      const kv = mapKv(sh);
      if (/weekly|update|status report/.test(nm)) { found.weeklyKv = kv; found.notes.push(`${fileName} › ${sh.name}: weekly update`); continue; }
      if (/project|profile|charter/.test(nm)) { found.projectKv = kv; found.notes.push(`${fileName} › ${sh.name}: project profile`); continue; }
    }
    if (/dimension|rag/.test(nm)) { const d = mapDims(sh); if (d) { found.dims = d; found.notes.push(`${fileName} › ${sh.name}: ${plural(d.length, 'dimension')}`); continue; } }
    if (/message|highlight|commentary/.test(nm)) { const d = mapMessages(sh); if (d) { found.messages = d; found.notes.push(`${fileName} › ${sh.name}: key messages`); continue; } }
    if (/raid|risk|issue|action/.test(nm)) { const d = mapRaid(sh); if (d) { found.raid = d; found.notes.push(`${fileName} › ${sh.name}: ${plural(d.length, 'RAID item')}`); continue; } }
    if (/scope|fund|readiness/.test(nm)) { const d = mapScope(sh); if (d) { found.scope = d; found.notes.push(`${fileName} › ${sh.name}: ${plural(d.items.length, 'scope item')}`); continue; } }
    if (/key ?date|milestone|timeline/.test(nm)) { const d = mapKeyDates(sh); if (d) { found.keyDates = d; found.notes.push(`${fileName} › ${sh.name}: ${plural(d.length, 'key date')}`); continue; } }

  }
  return found;
}

function placeLabels(items, tiers, gap) {

  items.forEach(it => {

      const l = it.x - it.w / 2 - gap, r = it.x + it.w / 2 + gap;

}

  parts.push(`<line x1="${x0}" y1="${y}" x2="${xa}" y2="${y}" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`);
  parts.push(`<text x="${x0 - 26}" y="${y + 6}" text-anchor="end" font-size="18" font-weight="600" fill="#fff">Legacy</text>`);
  parts.push(`<text x="${x1 + 26}" y="${y + 6}" font-size="18" font-weight="700" fill="#fff">${esc(P().platform || 'Target')}</text>`);
  marks.filter(k => k.kind === 'Window').forEach(k => {
    const a = X(k.dd), b = X(k.de ?? k.dd);
    parts.push(`<rect x="${a}" y="${y - 13}" width="${Math.max(b - a, 6)}" height="26" rx="13" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>`);
  });

  items.push({ x: xa, w: textW(todayLbl, 15, 700) + 22, today: true, label: todayLbl, allowed: [0, 2] });
  marks.forEach(k => {
    const x = k.kind === 'Window' ? (X(k.dd) + X(k.de ?? k.dd)) / 2 : X(k.dd);
    const date = k.display || (k.kind === 'Window' && k.de ? `${fmtD(k.dd, k.de)} – ${fmtD(k.de, k.de)}` : fmtD(k.dd, M.A));

  pts.forEach((k, i) => {

      out.push(`<rect x="${xs}" y="${ly - 6}" width="${Math.max(xe - xs, 4)}" height="12" rx="3" fill="#5CC6A0" opacity=".55" ${tip([k.label, `${fmtD(k.dd, M.A)} to ${fmtD(k.de ?? k.dd, M.A)}`, k.display])}/>`);
      kItems.push({ x: (xs + xe) / 2, label: `${k.label} ${k.display || ''}`.trim(), k });
    } else {
      const c = k.kind === 'Go-live' ? '#2D2926' : k.dd <= M.A ? '#00965A' : '#fff';
      const r = k.kind === 'Go-live' ? 9 : 7;
      if (!hideMarker) out.push(`<path d="M${xs} ${ly - r} L${xs + r} ${ly} L${xs} ${ly + r} L${xs - r} ${ly} Z" fill="${c}" stroke="${k.kind === 'Go-live' ? '#2D2926' : '#00965A'}" stroke-width="2" ${tip([k.label, k.display || fmtLong(k.dd), k.status])}/>`);
      kItems.push({ x: xs, label: `${k.label}, ${k.display || fmtD(k.dd, M.A)}`, k });
    }
  });
  kItems.forEach(it => { it.w = textW(it.label, 12.5, 600); });
  placeLabels(kItems, [0, 1, 2], 10);
  const labelLayer = [];
  kItems.forEach(it => {
    if (it.tier < 0) return;
    const yy = ly - 18 - it.tier * 18;
    const lx = clamp(it.x, x0 + it.w / 2, x1 + statW - it.w / 2);
    out.push(`<line x1="${it.x}" y1="${yy + 3}" x2="${it.x}" y2="${ly - 9}" stroke="#CBC7C2"/>`);
    labelLayer.push(`<text x="${lx}" y="${yy}" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2D2926" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">${esc(it.label)}</text>`);
  });
  // phase rows
  const top = axisH + lane;
  phases.forEach((ph, i) => {
    const y = top + i * rowH, cy = y + rowH / 2;
    out.push(`<line x1="0" y1="${y}" x2="${Wd}" y2="${y}" stroke="#E2DFDB"/>`);
    out.push(`<text x="0" y="${cy - 3}" font-size="15" font-weight="700" fill="#2D2926">${esc(ph.name)}</text>`);
    out.push(`<text x="0" y="${cy + 15}" font-size="12.5" fill="#77726E">${ph.done} of ${ph.n} closed${ph.msTotal ? `, ${ph.msDone}/${ph.msTotal} milestones` : ''}</text>`);
    if (ph.start != null && ph.end != null) {
      const a = X(ph.start), b = Math.max(X(ph.end), a + 4);
      const tipLines = [ph.name, `${fmtD(ph.start, M.A)} to ${fmtD(ph.end, M.A)}`, `${round(ph.pct)}% complete; plan to date ${round(ph.planned)}%`, `${ph.done} closed, ${ph.inProg} in progress, ${ph.notStarted} not started`, ph.overdue ? `${ph.overdue} overdue` : ''];
      out.push(`<g ${tip(tipLines)}><rect x="${a}" y="${cy - 9}" width="${b - a}" height="18" rx="4" fill="#ECEAE6"/>`);
      const f = (b - a) * ph.pct / 100;
      if (f > 0) out.push(`<rect x="${a}" y="${cy - 9}" width="${Math.max(f, 4)}" height="18" rx="4" fill="#00965A"/>`);
      out.push(`<rect x="${a}" y="${cy - 18}" width="${b - a}" height="36" fill="transparent"/></g>`);
    }
    out.push(`<text x="${Wd - statW + 18}" y="${cy + 6}" font-size="17" font-weight="700" fill="#2D2926">${round(ph.pct)}%</text>`);
    if (ph.overdue) out.push(`<g transform="translate(${Wd - 58},${cy - 10})"><rect width="58" height="20" rx="10" fill="#FCE8E6"/><text x="29" y="14" text-anchor="middle" font-size="12" font-weight="700" fill="#9E2424">${ph.overdue} late</text></g>`);
  });
  out.push(`<line x1="0" y1="${top + phases.length * rowH}" x2="${Wd}" y2="${top + phases.length * rowH}" stroke="#E2DFDB"/>`);
  // today
  const xa = X(M.A);
  out.push(`<line x1="${xa}" y1="${axisH - 4}" x2="${xa}" y2="${H}" stroke="#2D2926" stroke-width="1.5"/>`);
  out.push(`<rect x="${xa - 30}" y="${H - 2}" width="60" height="20" rx="10" fill="#2D2926"/><text x="${xa}" y="${H + 12}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Today</text>`);
  out.push(`<text x="${Wd - statW + 18}" y="${axisH + lane - 8}" font-size="12.5" fill="#77726E">Complete</text>`);
  out.push(...labelLayer);
  return { svg: `<svg width="${Wd}" height="${H + 20}" viewBox="0 0 ${Wd} ${H + 20}" role="img" aria-label="Timeline by phase">${out.join('')}</svg>`, height: H + 20 };
}
function slideTimeline() {

function burnupSvg() {
  const pts = M.burnup;
  const Wd = 860, H = 560, ml = 46, mr = 150, mt = 14, mb = 34;
  const iw = Wd - ml - mr, ih = H - mt - mb;
  if (!pts.length) return `<div class="empty">No task data loaded.</div>`;
  const maxY = Math.max(10, Math.ceil(M.N / 10) * 10);
  const X = i => ml + (pts.length === 1 ? iw / 2 : i / (pts.length - 1) * iw);
  const Y = v => mt + ih - v / maxY * ih;
  const out = [];
  for (let v = 0; v <= maxY; v += maxY > 60 ? 20 : 10) {
    out.push(`<line x1="${ml}" y1="${Y(v)}" x2="${ml + iw}" y2="${Y(v)}" stroke="${v === 0 ? '#CBC7C2' : '#ECEAE6'}"/>`);
    out.push(`<text x="${ml - 10}" y="${Y(v) + 4}" text-anchor="end" font-size="12" fill="#77726E" class="num">${v}</text>`);
  }
  let lastM = -1;
  const mLabels = [];
  pts.forEach((p, i) => { const pp = parts(p.w + 3); if (pp.m !== lastM) { lastM = pp.m; mLabels.push({ x: X(i), t: MONTHS[pp.m] }); } });
  mLabels.forEach((l, i) => { const nx = mLabels[i + 1]; if (nx && nx.x - l.x < 40) return; out.push(`<text x="${l.x}" y="${H - 10}" text-anchor="middle" font-size="12" fill="#77726E">${l.t}</text>`); });
  // plan (step)
  let d = `M${X(0)} ${Y(pts[0].due)}`;
  pts.forEach((p, i) => { if (i) d += ` L${X(i)} ${Y(pts[i - 1].due)} L${X(i)} ${Y(p.due)}`; });
  out.push(`<path d="${d}" fill="none" stroke="#8C8783" stroke-width="2" stroke-linejoin="round"/>`);
  // actual
  const act = pts.map((p, i) => ({ i, v: p.closed })).filter(x => x.v != null);
  if (act.length) {
    const a = `M${X(act[0].i)} ${Y(act[0].v)}` + act.slice(1).map(x => ` L${X(x.i)} ${Y(x.v)}`).join('');
    out.push(`<path d="${a} L${X(act[act.length - 1].i)} ${Y(0)} L${X(act[0].i)} ${Y(0)} Z" fill="#00965A" opacity=".10"/>`);
    out.push(`<path d="${a}" fill="none" stroke="#00965A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`);
    const L = act[act.length - 1];
    out.push(`<circle cx="${X(L.i)}" cy="${Y(L.v)}" r="5" fill="#00965A" stroke="#fff" stroke-width="2"/>`);
  }
  // today
  const ti = pts.findIndex(p => M.A >= p.w && M.A <= p.end);
  if (ti >= 0) {
    const xt = X(ti);
    out.push(`<line x1="${xt}" y1="${mt}" x2="${xt}" y2="${mt + ih}" stroke="#2D2926" stroke-width="1.2"/>`);
    out.push(`<text x="${xt + 6}" y="${mt + 12}" font-size="12" font-weight="700" fill="#2D2926">Today</text>`);
    const dueNow = cnt(M.tasks, t => t.d != null && t.d <= M.A);
    out.push(`<text x="${xt + 8}" y="${Y(pts[ti].closed ?? 0) + 18}" font-size="13" fill="#2D2926"><tspan font-weight="700">${M.done} closed</tspan><tspan fill="#5E5955"> vs ${dueNow} due</tspan></text>`);
  }
  const last = pts[pts.length - 1];
  out.push(`<text x="${ml + iw + 10}" y="${Y(last.due) + 4}" font-size="13" fill="#5E5955">${last.due} due by plan</text>`);
  // go-live marker
  if (M.goLive) {
    const gi = pts.findIndex(p => M.goLive.dd >= p.w && M.goLive.dd <= p.end);
    if (gi >= 0) {
      const xg = X(gi);
      out.push(`<line x1="${xg}" y1="${mt}" x2="${xg}" y2="${mt + ih}" stroke="#2D2926" stroke-width="1" opacity=".55"/>`);
      out.push(`<text x="${xg - 6}" y="${mt + 12}" text-anchor="end" font-size="12" fill="#5E5955">Go-live</text>`);
    }
  }
  out.push(`<line class="bu-x" x1="0" y1="${mt}" x2="0" y2="${mt + ih}" stroke="#2D2926" stroke-width="1" opacity="0"/>`);
  out.push(`<rect class="bu-hit" x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent" data-ml="${ml}" data-iw="${iw}" data-n="${pts.length}"/>`);
  return `<svg class="burnup" width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Burn-up: tasks due by plan versus tasks closed">${out.join('')}</svg>`;
}

  if (M.paceNeeded != null) auto += ` Go-live needs ${M.paceNeeded.toFixed(1)} tasks a week; the last four weeks averaged ${M.paceRecent.toFixed(1)}.`;
  const body = `<div class="pg-grid">${fig}
    <div>
      <div class="fig-head"><h3>Progress against plan to date, by phase</h3></div>
      <div class="fig-legend" style="margin:-2px 0 6px"><span><i style="background:#00965A"></i>Complete</span><span><i style="background:#2D2926;width:3px;height:14px;border-radius:1px"></i>Plan to date (${M.basis === 'time' ? 'time-phased' : 'due date'})</span></div>

        <div class="fig-legend">${mix.map(x => `<span><i style="background:${x[2]}"></i>${x[0]} ${x[1]}</span>`).join('')}${M.overdue.length ? `<span>${IC.late.replace('<svg', '<svg width="12" height="12"')}Overdue ${M.overdue.length}</span>` : ''}</div></div>

      ${x.st.map((s, i) => `<td><span class="glyph" ${tip([x.name, `${stages[i]}: ${s || 'not set'}`])}>${STAGE_IC[s] || IC.tbc}</span></td>`).join('')}<td class="note">${esc(x.note)}</td></tr>`).join('')).join('')}
  </tbody></table>
  <div class="mx-legend">${['Done', 'In progress', 'Not started', 'Blocked', 'TBC'].map(s => `<span>${STAGE_IC[s]}${s === 'TBC' ? 'To be confirmed' : s}</span>`).join('')}</div>`;
  const ss = M.scopeStats;

function registerSlides() {
  const mode = state.settings.registerMode || 'all';
  if (mode === 'off') return [];
  const list = M.tasks.filter(t => mode === 'all' || !t.done);
  const byPhase = M.phases.map(p => ({ p, ts: list.filter(t => t.phase === p.name).sort((a, b) => (a.d ?? 1e9) - (b.d ?? 1e9) || a.idx - b.idx) })).filter(x => x.ts.length);
  const showOwner = M.assignees.size > 1;
  const rowsPerPage = 19;
  const lines = [];
  byPhase.forEach(g => { lines.push({ grp: g.p }); g.ts.forEach(t => lines.push({ t })); });
  const pages = [];
  let cur = [];
  lines.forEach((ln, i) => {
    if (cur.length >= rowsPerPage || (ln.grp && cur.length >= rowsPerPage - 1)) { pages.push(cur); cur = []; }
    if (!cur.length && ln.t) { const gi = lines.slice(0, i).reverse().find(x => x.grp); if (gi) cur.push({ grp: gi.grp, cont: true }); }
    cur.push(ln);
  });
  if (cur.length) pages.push(cur);
  return pages.map((pg, pi) => {
    const rows = pg.map(ln => {
      if (ln.grp) return `<tr class="grp"><td colspan="${showOwner ? 9 : 8}">${esc(ln.grp.name)}${ln.cont ? ' (continued)' : `: ${ln.grp.done} of ${ln.grp.n} closed, ${round(ln.grp.pct)}% complete`}</td></tr>`;
      const t = ln.t;
      const varTxt = t.done ? (t.r != null && t.d != null ? (t.r <= t.d ? 'On time' : `${t.r - t.d} days late`) : 'Closed') : t.overdue ? `<span class="chip chip--late">${plural(t.daysLate, 'day')} late</span>` : t.d != null ? (t.d - M.A === 0 ? 'Due today' : `Due in ${plural(t.d - M.A, 'day')}`) : '–';
      return `<tr><td class="num" style="width:44px;text-align:left">${esc(t.id)}</td><td><span style="display:flex;align-items:flex-start">${t.milestone ? '<i class="ms" style="margin-top:6px" title="Milestone"></i>' : ''}<span>${esc(t.title)}</span></span></td><td>${esc(t.item)}</td>${showOwner ? `<td>${esc(t.assignee)}</td>` : ''}
        <td class="nowrap">${esc(fmtD(t.s, M.A))}</td><td class="nowrap">${esc(fmtD(t.d, M.A))}</td><td>${statusChip(Object.assign({}, t, { overdue: false }))}</td><td class="num">${round(t.prog)}%</td><td class="nowrap">${varTxt}</td></tr>`;
    }).join('');
    const body = `<table class="tbl"><thead><tr><th style="width:44px">#</th><th>Task</th><th style="width:230px">Workstream</th>${showOwner ? '<th style="width:150px">Owner</th>' : ''}<th style="width:92px">Start</th><th style="width:92px">Due</th><th style="width:140px">Status</th><th class="num" style="width:60px">Done</th><th style="width:130px">Schedule</th></tr></thead><tbody>${rows}</tbody></table>`;
    const auto = pi === 0 ? `${plural(list.length, mode === 'all' ? 'task' : 'open task')} by phase, in due-date order. Milestone tasks carry a diamond.` : '';
    return frame(`register-${pi + 1}`, `Appendix A: task register (${pi + 1} of ${pages.length})`, auto, body);
  });
}

let current = 0, view = 'slides', presenting = false, slideKeys = [];
function render() {
  M = compute(state);
  const hidden = state.settings.hidden || {};
  const html = [];
  SLIDES.forEach(([key, , fn]) => {
    if (hidden[key]) return;
    if (key === 'register') registerSlides().forEach(h => html.push(h));
    else html.push(fn());
  });
  const keyOf = h => (/data-key="([^"]+)"/.exec(h) || [])[1];
  const prevKey = slideKeys[current];
  slideKeys = html.map(keyOf);
  const total = html.length;
  const stage = $('#stage');
  stage.innerHTML = html.map((h, i) => `<div class="slide-wrap" data-i="${i}">${h.replace('%%PAGE%%', `${i + 1} of ${total}`)}</div>`).join('');
  const ki = slideKeys.indexOf(prevKey);
  current = ki >= 0 ? ki : clamp(current, 0, total - 1);
  setActive(current);
  layout();
  fitAll();
  updateToolbar();
  if ($('#drawer').classList.contains('open') && activeTab === 'checks') renderChecksPane();
}
function setActive(i) {
  const wraps = $$('.slide-wrap');
  current = clamp(i, 0, wraps.length - 1);
  wraps.forEach((w, j) => w.classList.toggle('active', j === current));
  $('#count').textContent = `${current + 1} / ${wraps.length}`;
  if (view === 'scroll' && !presenting) { const w = wraps[current]; if (w) w.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  hideTip();
}
function layout() {
  const tbH = presenting ? 0 : $('#toolbar').offsetHeight;
  document.documentElement.style.setProperty('--tb-h', tbH + 'px');
  const stage = $('#stage');
  const W = stage.clientWidth, H = stage.clientHeight;
  let s;
  if (view === 'scroll' && !presenting) s = Math.min(1, (W - 48) / 1600);
  else { const padPx = presenting ? 0 : 40; s = Math.min((W - padPx) / 1600, (H - padPx) / 900); }
  s = Math.max(s, 0.1);
  document.documentElement.style.setProperty('--s', s.toFixed(4));
  $$('.slide-wrap').forEach(w => {
    if (view === 'scroll' && !presenting) { w.style.marginLeft = ''; w.style.marginTop = ''; }
    else { w.style.marginLeft = `${-800 * s}px`; w.style.marginTop = `${-450 * s}px`; }
  });
}
let overflowNotes = [];
function fitAll() {
  overflowNotes = [];
  $$('.slide [data-fit]').forEach(el => {
    const min = parseFloat(el.dataset.fit) || 0.8;
    let f = 1;
    el.style.setProperty('--fz', '1');
    el.style.fontSize = '';
    const base = parseFloat(getComputedStyle(el).fontSize);
    const over = () => el.scrollHeight > el.clientHeight + 1;
    while (over() && f > min) { f = Math.round((f - 0.03) * 100) / 100; el.style.fontSize = (base * f) + 'px'; scaleChildren(el, f); }
    el.classList.toggle('overflowing', over());
    if (over()) { const slide = el.closest('.slide'); overflowNotes.push(slide ? (slide.querySelector('.s-title, .cv-title') || {}).textContent : 'a slide'); }
  });
}
function scaleChildren(el, f) {
  // shrink text that has its own pixel size, relative to its stylesheet size
  $$('*', el).forEach(c => {
    if (c.closest('svg')) return;
    if (!c.dataset.fs) { c.style.fontSize = ''; c.dataset.fs = parseFloat(getComputedStyle(c).fontSize); }
    c.style.fontSize = (parseFloat(c.dataset.fs) * f) + 'px';
  });
}
function updateToolbar() {
  const p = P();
  $('#tb-name').textContent = `${p.project || 'Project'} | ${p.clientShort || p.client || ''} governance deck`;

  <div class="fld"><select id="set-register">${[['all', 'All tasks'], ['open', 'Open tasks only'], ['off', 'Leave out']].map(([v, l]) => `<option value="${v}"${(s.registerMode || 'all') === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>

  <div class="dr-section">Logo</div>
  <div class="fld">${state.logo ? `<img src="${escAttr(state.logo)}" alt="Current logo" style="max-height:40px;max-width:220px;display:block;margin-bottom:8px;background:#fff;padding:4px">` : '<div class="hint" style="margin-bottom:8px">No logo yet: the organisation name is shown instead. Use the official logo file from your brand portal.</div>'}
    <button class="btn" id="set-logo" type="button">Choose logo file</button> ${state.logo ? '<button class="btn" id="set-logo-clear" type="button">Remove</button>' : ''}</div>

    ${(state.history || []).length ? `<br>Weekly history: ${state.history.map(h => esc(h.week)).join(', ')}.` : ''}</div>

}

/* ======================================================================
   13. Files: load, export, print
   ====================================================================== */
async function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const notes = [], errors = [];
  const merged = { notes: [] };
  for (const f of files) {
    try {
      const ext = f.name.toLowerCase().split('.').pop();
      let sheets;
      if (ext === 'csv' || ext === 'txt') sheets = [{ name: f.name.replace(/\.[^.]+$/, ''), rows: parseCsv(await readFileText(f)), date1904: false }];
      else if (ext === 'xlsx' || ext === 'xlsm') sheets = readXlsx(await f.arrayBuffer());
      else if (ext === 'xls') throw new Error('legacy .xls is not supported. Save it as .xlsx, or use Export to CSV.');
      else throw new Error('unsupported file type. Use .xlsx or .csv.');
      const found = importSheets(sheets, f.name);
      if (found.tasks) merged.tasks = (merged.tasks || []).concat(found.tasks);
      ['raid', 'scope', 'keyDates', 'team', 'dims', 'messages', 'projectKv', 'weeklyKv'].forEach(k => { if (found[k]) merged[k] = found[k]; });
      notes.push(...found.notes);
      const kinds = Object.keys(found).filter(k => k !== 'notes');
      state.meta.files = (state.meta.files || []).concat([{ name: f.name, at: new Date().toISOString(), parts: kinds }]).slice(-10);
      if (!kinds.length) errors.push(`${f.name}: no task list or inputs tabs were recognised.`);
    } catch (e) {
      errors.push(`${f.name}: ${e.message}`);
    }
  }
  if (merged.tasks) {
    const names = [...new Set(merged.tasks.map(t => t.project).filter(Boolean))];
    const want = String(P().clientShort || P().client || '').toLowerCase();
    if (names.length > 1 && want) {
      const keep = merged.tasks.filter(t => String(t.project).toLowerCase() === want);
      if (keep.length) { notes.push(`Kept ${keep.length} of ${merged.tasks.length} rows where Project Name is ${P().clientShort || P().client}.`); merged.tasks = keep; }
      else notes.push(`No rows have Project Name ${P().clientShort || P().client}; all ${merged.tasks.length} rows were loaded.`);
    }
  }
  if (merged.tasks && state.settings.asOf && weekKeyOf(state.settings.asOf) < weekKeyOf(todayIso())) {
    notes.push(`Reporting date moved from ${fmtD(isoToDay(state.settings.asOf))} to today, ${fmtD(isoToDay(todayIso()))}. Change it in Status as of if needed.`);
    state.settings.asOf = null;
  }
  if (Object.keys(merged).length > 1) {
    applyImport(merged);
    saveDraft();
    render();
    if (activeTab === 'update' && $('#drawer').classList.contains('open')) renderUpdatePane();
  }
  showToast([...notes, ...errors].join('\n') || 'Nothing was loaded.', null, errors.length ? 12000 : 7000);
}
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const fileStem = () => `${(P().project || 'Project').replace(/[^\w]+/g, '')}_${(P().clientShort || P().client || '').replace(/[^\w]+/g, '')}`;
function upsertHistory(S) {
  const e = { week: M.weekKey, asOf: M.asIso, pct: +M.pctActual.toFixed(1), planned: +M.pctPlanned.toFixed(1), done: M.done, total: M.N, overdue: M.overdue.length, due14: M.due14.length, lateStarts: M.lateStarts.length, overall: normRag(S.weekly.overall), openRaid: M.raidStats.open, savedAt: new Date().toISOString() };
  S.history = (S.history || []).filter(h => h.week !== e.week).concat([e]).sort((a, b) => (a.week < b.week ? -1 : 1));
}
function exportSnapshot() {
  const snap = JSON.parse(JSON.stringify(state));
  upsertHistory(snap);
  snap.meta.snapshotId = 'snap-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  snap.meta.savedAt = new Date().toISOString();
  delete snap.meta.draftSavedAt;
  const json = JSON.stringify(snap).replace(/</g, '\\u003c');
  const i = PRISTINE.indexOf(EMBED_OPEN), j = PRISTINE.indexOf(SCRIPT_CLOSE, i);
  if (i < 0 || j < 0) { showToast('Could not create the snapshot: the page template was not found.'); return; }
  const html = PRISTINE.slice(0, i + EMBED_OPEN.length) + json + PRISTINE.slice(j);
  const name = `${fileStem()}_Governance_${M.weekKey}_${M.asIso}.html`;
  download(new Blob([html], { type: 'text/html' }), name);
  clearDraft();
  state.history = snap.history;
  state.meta.snapshotId = snap.meta.snapshotId;
  state.meta.savedAt = snap.meta.savedAt;
  delete state.meta.draftSavedAt;
  showToast(`Saved ${name}.\nShare this file or open it next week to continue. It already contains this week's data and history.`);
}
function exportInputs() {
  try {
    const bytes = writeXlsx(buildInputsWorkbook());
    const name = `${fileStem()}_Governance_Inputs_${M.weekKey}.xlsx`;
    download(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name);
    showToast(`Saved ${name}. Edit it in Excel and load it back with Load data.`);
  } catch (e) { showToast('Could not create the workbook: ' + e.message); }
}

/* ======================================================================
   14. Toast and tooltip
   ====================================================================== */
let toastTimer;
function showToast(text, action, ms) {
  const t = $('#toast');
  $('#toast-body').textContent = text;
  const ab = $('#toast-action');
  if (action) { ab.hidden = false; ab.textContent = action.label; ab.onclick = () => { action.run(); t.classList.remove('show'); }; } else { ab.hidden = true; ab.onclick = null; }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 7000);
}
const tipEl = () => $('#tooltip');
function showTip(text, x, y) {
  const el = tipEl();
  el.textContent = '';
  const lines = String(text).split('\n');
  const h = document.createElement('div'); h.className = 'tt-head'; h.textContent = lines[0]; el.appendChild(h);
  lines.slice(1).forEach(l => { const d = document.createElement('div'); d.className = 'tt-line'; d.textContent = l; el.appendChild(d); });
  el.style.display = 'block';
  const r = el.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  el.style.left = Math.max(8, left) + 'px';
  el.style.top = Math.max(8, top) + 'px';
}
function hideTip() { const el = tipEl(); if (el) el.style.display = 'none'; $$('.bu-x').forEach(l => l.setAttribute('opacity', '0')); }
function onPointerMove(e) {
  const hit = e.target.closest && e.target.closest('.bu-hit');
  if (hit) {
    const svg = hit.ownerSVGElement;
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    const ml = +hit.dataset.ml, iw = +hit.dataset.iw, n = +hit.dataset.n;
    const i = clamp(Math.round((loc.x - ml) / iw * (n - 1)), 0, n - 1);
    const p = M.burnup[i];
    const x = ml + (n === 1 ? iw / 2 : i / (n - 1) * iw);
    const line = svg.querySelector('.bu-x');
    line.setAttribute('x1', x); line.setAttribute('x2', x); line.setAttribute('opacity', '.5');
    showTip([`Week of ${fmtD(p.w, M.A)}`, `Due by plan: ${p.due}`, p.closed != null ? `Closed: ${p.closed}` : 'Closed: not yet reached'].join('\n'), e.clientX, e.clientY);
    return;
  }
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el && el.closest('#stage')) showTip(el.dataset.tip, e.clientX, e.clientY);
  else hideTip();
}

/* ======================================================================
   15. Wiring
   ====================================================================== */
function go(delta) { setActive(current + delta); }
function togglePresent() {
  if (!document.fullscreenElement) { (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(() => { presenting = !presenting; document.body.classList.toggle('presenting', presenting); layout(); }); }
  else document.exitFullscreen();
}
function bind() {
  $('#btn-load').onclick = () => $('#file-input').click();
  $('#file-input').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
  $('#asof').onchange = e => { const v = e.target.value; state.settings.asOf = v || null; saveDraft(); render(); if ($('#drawer').classList.contains('open')) openDrawer(activeTab); };
  $('#prev').onclick = () => go(-1);
  $('#next').onclick = () => go(1);
  $('#btn-update').onclick = () => ($('#drawer').classList.contains('open') && activeTab === 'update') ? closeDrawer() : openDrawer('update');
  $('#btn-checks').onclick = () => ($('#drawer').classList.contains('open') && activeTab === 'checks') ? closeDrawer() : openDrawer('checks');
  $('#btn-help').onclick = () => ($('#drawer').classList.contains('open') && activeTab === 'help') ? closeDrawer() : openDrawer('help');
  $('#dr-close').onclick = closeDrawer;
  $$('.dr-tabs [data-tab]').forEach(b => { b.onclick = () => openDrawer(b.dataset.tab); });
  $('#btn-view').onclick = () => { view = view === 'slides' ? 'scroll' : 'slides'; document.body.classList.toggle('view-slides', view === 'slides'); document.body.classList.toggle('view-scroll', view === 'scroll'); layout(); setActive(current); updateToolbar(); };
  $('#btn-present').onclick = togglePresent;
  const menu = $('#export-menu');
  $('#btn-export').onclick = e => { e.stopPropagation(); const open = !menu.classList.contains('open'); menu.classList.toggle('open', open); $('#btn-export').setAttribute('aria-expanded', open); };
  document.addEventListener('click', e => { if (!menu.contains(e.target)) { menu.classList.remove('open'); $('#btn-export').setAttribute('aria-expanded', 'false'); } });
  $('#act-snapshot').onclick = () => { menu.classList.remove('open'); exportSnapshot(); };
  $('#act-inputs').onclick = () => { menu.classList.remove('open'); exportInputs(); };
  $('#act-print').onclick = () => { menu.classList.remove('open'); setTimeout(() => window.print(), 50); };
  $('#toast-close').onclick = () => $('#toast').classList.remove('show');
  const paneU = $('#pane-update');
  paneU.addEventListener('input', onUpdateInput);
  paneU.addEventListener('change', onUpdateInput);
  paneU.addEventListener('click', onSegClick);
  paneU.addEventListener('focusin', e => { const t = e.target; gotoSlide(t.dataset.tk || 'summary'); });
  const paneS = $('#pane-settings');
  paneS.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'set-basis') state.settings.planBasis = t.value;
    else if (t.id === 'set-register') state.settings.registerMode = t.value;
    else if (t.dataset.slide) { state.settings.hidden = state.settings.hidden || {}; state.settings.hidden[t.dataset.slide] = !t.checked; }
    else return;
    saveDraft(); render();
  });
  paneS.addEventListener('click', e => {
    if (e.target.id === 'set-logo') $('#logo-input').click();
    if (e.target.id === 'set-logo-clear') { state.logo = null; saveDraft(); render(); renderSettingsPane(); }
    if (e.target.id === 'set-revert') {
      if (!confirm('Discard the unsaved changes kept in this browser and go back to the data saved in this file?')) return;
      clearDraft(); state = loadState(); render(); renderSettingsPane(); showToast('Unsaved changes discarded.');
    }
  });
  $('#logo-input').onchange = e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (f.size > 600 * 1024) { showToast('That image is larger than 600 KB. Use a smaller logo file so the deck stays light.'); return; }
    const rd = new FileReader();
    rd.onload = () => { state.logo = rd.result; saveDraft(); render(); renderSettingsPane(); };
    rd.readAsDataURL(f);
  };
  $('#stage').addEventListener('click', e => { const b = e.target.closest('[data-toggle-table]'); if (b) { const fig = b.closest('.fig'); fig.classList.toggle('show-table'); b.textContent = fig.classList.contains('show-table') ? 'Chart' : 'Table'; } });
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerleave', hideTip);
  $('#stage').addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el.dataset.tip, r.left + r.width / 2, r.bottom); } });
  $('#stage').addEventListener('focusout', hideTip);
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === 'Home') setActive(0);
    else if (e.key === 'End') setActive(9999);
    else if (e.key === 'f' || e.key === 'F') togglePresent();
    else if (e.key === 'Escape') { closeDrawer(); $('#export-menu').classList.remove('open'); }
  });
  document.addEventListener('fullscreenchange', () => { presenting = !!document.fullscreenElement; document.body.classList.toggle('presenting', presenting); layout(); setActive(current); });
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) { dragDepth++; $('#drop').classList.add('show'); } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop').classList.remove('show'); });
  window.addEventListener('dragover', e => { e.preventDefault(); });
  window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('show'); if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
  window.addEventListener('resize', debounce(() => { layout(); }, 80));
  window.addEventListener('beforeprint', () => { hideTip(); });
}

function init() {
  try { state = loadState(); }
  catch (e) { document.body.innerHTML = `<p style="padding:24px;font:16px Arial">${esc(e.message)}</p>`; return; }
  const draft = readDraft();
  let restored = false;
  if (draft && draft.version && draft.meta && draft.meta.draftSavedAt && (!state.meta.savedAt || draft.meta.draftSavedAt > state.meta.savedAt)) { state = draft; restored = true; }
  bind();
  if (window.innerWidth < 820) { view = 'scroll'; document.body.classList.remove('view-slides'); document.body.classList.add('view-scroll'); }
  render();
  if (restored) showToast(`Restored your unsaved changes from ${new Date(state.meta.draftSavedAt).toLocaleString()}.`, { label: 'Discard them', run: () => { clearDraft(); state = loadState(); render(); } }, 9000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
  window.__deck = { get state() { return state; }, get metrics() { return M; }, render, handleFiles, exportSnapshot, exportInputs, buildInputsWorkbook, writeXlsx, readXlsx, parseCsv, importSheets, setActive, compute };
}
init();
})();
